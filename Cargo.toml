[package]
name = "elcotel-emu"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "elcotel-emu"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.32.3"
cpal = "0.15"
md-5 = "0.10.6"
rand = "0.8.8"
serde = { version = "1", features = ["derive"] }
rfd = { version = "0.15", default-features = false }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
strip = true
